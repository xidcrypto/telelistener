version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        VERSION: ${VERSION:-latest}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/telegram_monitor
      - REDIS_URL=redis://redis:6379
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - PHONE_NUMBER=${PHONE_NUMBER}
      - SESSION_ENC_KEY=${SESSION_ENC_KEY}
    volumes:
      - ./data:/app/data
      - ./media:/app/media
    depends_on:
      - postgres
      - redis
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '500m'
          memory: 512M
        reservations:
          cpus: '250m'
          memory: 256M

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=telegram_monitor
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '500m'
          memory: 512M
        reservations:
          cpus: '250m'
          memory: 256M

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '250m'
          memory: 256M
        reservations:
          cpus: '125m'
          memory: 128M

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - app
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '250m'
          memory: 256M
        reservations:
          cpus: '125m'
          memory: 128M

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge